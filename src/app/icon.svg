<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="35%" stop-color="#C5A880" />
      <stop offset="70%" stop-color="#9E7D47" />
      <stop offset="100%" stop-color="#E5D3A3" />
    </linearGradient>

    <!-- Deep Luxury Obsidian Gradient -->
    <radialGradient id="darkBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2A2826" />
      <stop offset="60%" stop-color="#1C1B1A" />
      <stop offset="100%" stop-color="#100F0E" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Obsidian Background -->
  <circle cx="256" cy="256" r="246" fill="url(#darkBg)" />

  <!-- Outer Double Gold Rings -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.9" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.6" />

  <!-- Architectural Islamic Arch (Mihrab Silhouette) -->
  <path d="M 160 380 
           L 160 250 
           C 160 170, 210 120, 256 90 
           C 302 120, 352 170, 352 250 
           L 352 380 
           Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="3" 
        stroke-opacity="0.85" />

  <!-- Inner Arch Accent -->
  <path d="M 175 380 
           L 175 256 
           C 175 186, 218 140, 256 114 
           C 294 140, 337 186, 337 256 
           L 337 380" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.5" 
        stroke-opacity="0.45" />

  <!-- Top Star / Finial (Eight-pointed Star Accent) -->
  <g transform="translate(256, 82) scale(0.9)">
    <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="2.5" fill="#FFF" />
  </g>

  <!-- Regal Monogram Letter "H" (Serif Luxury Typographic Emblem) -->
  <!-- Left Pillar -->
  <path d="M 194 195 L 226 195 L 226 205 L 216 205 L 216 335 L 226 335 L 226 345 L 194 345 L 194 335 L 204 335 L 204 205 L 194 205 Z" 
        fill="url(#goldGrad)" filter="url(#goldGlow)" />

  <!-- Right Pillar -->
  <path d="M 286 195 L 318 195 L 318 205 L 308 205 L 308 335 L 318 335 L 318 345 L 286 345 L 286 335 L 296 335 L 296 205 L 286 205 Z" 
        fill="url(#goldGrad)" filter="url(#goldGlow)" />

  <!-- Middle Crossbar with Elegant Diamond Knot -->
  <path d="M 204 265 L 308 265 L 308 275 L 204 275 Z" fill="url(#goldGrad)" />
  <polygon points="256,260 264,270 256,280 248,270" fill="#FFF" opacity="0.9" />

  <!-- Delicate Modest Flourish Ribbon Accent at Base -->
  <path d="M 210 395 C 235 390, 277 390, 302 395" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        stroke-linecap="round" />
  <circle cx="256" cy="392" r="3" fill="url(#goldGrad)" />
</svg>
